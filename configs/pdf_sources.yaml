# PDFs merged into the single batched source PDF the pipeline consumes.
#
# - Filenames resolve against data/raw/ — put the source PDFs there.
# - Order matters: the merged PDF's page order is exactly this list's order.
# - All listed PDFs must exist or the pipeline fails with a clear error.
# - A SINGLE entry is used directly (no re-encoding), so document IDs stay
#   stable (document_id = sha256(source_sha : person_index)).
#
# Adding more PDFs changes the merged source — re-verify configs/splits.yaml
# person boundaries against the new page layout (assembly refuses to guess).
#
# data/raw currently holds: black_dataset.pdf (48 pages = the 12-person source
# described by configs/splits.yaml), colored_data.pdf, RRB SCAN 16092026.pdf.
pdfs:
  - black_dataset.pdf
