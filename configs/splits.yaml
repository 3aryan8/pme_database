# Person split map for the pipeline's source PDF — the MERGED PDF
# (data/merged/merged_source.pdf), always, whether one or many PDFs are
# configured in configs/pdf_sources.yaml.
#
# DYNAMIC MODE — no static page ranges:
#   Every person occupies exactly `pages_per_person` consecutive pages, in
#   page order. Person count = merged page count / pages_per_person, so the
#   map stays correct when more PDFs are added and the merged PDF grows.
#
# Assembly REFUSES to run when:
#   - confirmed is false, or
#   - the merged PDF's page count is not a multiple of pages_per_person
#     (it never guesses a partial person).
#
# Non-uniform reports (a person with 3 or 6 pages): replace
# pages_per_person with an explicit 'persons' list of page ranges —
# scripts/make_splits.py and src.detection.pose_splits draft that format.
#
# This file contains no PII — safe to commit.
source: "data/merged/merged_source.pdf"
confirmed: true
pages_per_person: 4
ignored_pages: []
